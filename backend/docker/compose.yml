services:

  postgres:

    image: postgres:17

    container_name: medical_postgres

    restart: unless-stopped

    env_file:
      - ../.env

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - ../database/postgres/data:/var/lib/postgresql/data

      - ../database/postgres/init:/docker-entrypoint-initdb.d